global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'vllm'
    file_sd_configs:
      - files:
          - '/monitoring/vllm_targets.json'
        refresh_interval: 30s

  - job_name: 'jaeger'
    static_configs:
      - targets: ['localhost:14269']
    metrics_path: /metrics

    file_sd_configs:
      - files:
          - '/monitoring/gpu_targets.json'
        refresh_interval: 30s
